<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пульт экрана</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .mini-status {
        margin: 10px 0 0;
        color: #626a76;
        font-size: 16px;
        min-height: 24px;
      }
    </style>
  </head>
  <body class="control-page">
    <main id="loginScreen" class="gate">
      <div class="gate-card">
        <h1>Управление</h1>
        <input id="passwordInput" type="password" inputmode="numeric" placeholder="Пароль" aria-label="Пароль">
        <button id="loginButton" type="button">Войти</button>
        <p id="loginError" class="error" hidden>Неверный пароль</p>
      </div>
    </main>

    <main id="panel" class="panel" hidden>
      <header class="panel-header">
        <div>
          <h1>Пульт экрана</h1>
          <p id="status">Готово</p>
        </div>
        <button id="blankButton" class="ghost-button" type="button">Очистить</button>
      </header>

      <section class="section">
        <h2>Цвет</h2>
        <div class="color-grid">
          <button class="color-button green" data-color="green" type="button">Зелёный</button>
          <button class="color-button yellow" data-color="yellow" type="button">Жёлтый</button>
          <button class="color-button red" data-color="red" type="button">Красный</button>
        </div>
        <label class="switch-row">
          <input id="wordsToggle" type="checkbox">
          <span>Показывать слова</span>
        </label>
        <p id="lastAction" class="mini-status"></p>
      </section>

      <section class="section">
        <h2>Положение телефона</h2>
        <div class="segmented" role="group" aria-label="Положение телефона">
          <button data-orientation="landscape" type="button" class="active">Горизонтально</button>
          <button data-orientation="portrait" type="button">Вертикально</button>
          <button data-orientation="upside" type="button">Вверх ногами</button>
        </div>
      </section>

      <section class="section">
        <h2>Текст</h2>
        <textarea id="message" rows="4" placeholder="Напиши текст для экрана"></textarea>
        <button id="sendText" type="button">Готово</button>
      </section>

      <section class="section">
        <h2>Фото и видео</h2>
        <div class="upload-row">
          <label class="file-button">
            Фото
            <input id="imageInput" type="file" accept="image/*">
          </label>
          <label class="file-button">
            Видео
            <input id="videoInput" type="file" accept="video/*">
          </label>
        </div>
        <p class="hint">Лучше брать короткие видео до 20 МБ.</p>
      </section>
    </main>

    <script>
      const PASSWORD = "230493";
      const STATE_URL = "https://hhh3-635eb-default-rtdb.europe-west1.firebasedatabase.app/statusScreen/current.json";

      const loginScreen = document.querySelector("#loginScreen");
      const panel = document.querySelector("#panel");
      const passwordInput = document.querySelector("#passwordInput");
      const loginButton = document.querySelector("#loginButton");
      const loginError = document.querySelector("#loginError");
      const statusText = document.querySelector("#status");
      const lastAction = document.querySelector("#lastAction");
      const wordsToggle = document.querySelector("#wordsToggle");
      const message = document.querySelector("#message");
      const orientationButtons = document.querySelectorAll("[data-orientation]");

      let state = {
        type: "blank",
        color: null,
        showWords: false,
        customText: "",
        media: null,
        orientation: "landscape",
        updatedAt: Date.now(),
      };

      loginButton.addEventListener("click", unlock);
      passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") unlock();
      });

      function unlock() {
        const typed = passwordInput.value.replace(/\D/g, "");
        if (typed !== PASSWORD) {
          loginError.hidden = false;
          return;
        }
        loginError.hidden = true;
        loginScreen.style.display = "none";
        panel.hidden = false;
        panel.style.display = "block";
        statusText.textContent = "Пульт открыт";
        loadState();
      }

      document.querySelectorAll("[data-color]").forEach((button) => {
        button.addEventListener("click", () => {
          sendState({
            type: "color",
            color: button.dataset.color,
            showWords: wordsToggle.checked,
            media: null,
          });
        });
      });

      wordsToggle.addEventListener("change", () => {
        sendState({ showWords: wordsToggle.checked });
      });

      orientationButtons.forEach((button) => {
        button.addEventListener("click", () => {
          orientationButtons.forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          sendState({ orientation: button.dataset.orientation });
        });
      });

      document.querySelector("#sendText").addEventListener("click", () => {
        sendState({
          type: "text",
          customText: message.value,
          media: null,
        });
      });

      document.querySelector("#blankButton").addEventListener("click", () => {
        sendState({
          type: "blank",
          color: null,
          customText: "",
          media: null,
        });
      });

      document.querySelector("#imageInput").addEventListener("change", (event) => {
        sendFile(event.target.files[0], "image");
      });

      document.querySelector("#videoInput").addEventListener("change", (event) => {
        sendFile(event.target.files[0], "video");
      });

      async function loadState() {
        try {
          const response = await fetch(`${STATE_URL}?t=${Date.now()}`, { cache: "no-store" });
          const data = await response.json();
          if (data) state = { ...state, ...data };
          wordsToggle.checked = Boolean(state.showWords);
          message.value = state.customText || "";
          statusText.textContent = "База подключена";
        } catch (error) {
          statusText.textContent = "База не отвечает";
        }
      }

      async function sendState(patch) {
        state = { ...state, ...patch, updatedAt: Date.now() };
        statusText.textContent = "Отправляю...";
        lastAction.textContent = "";

        try {
          const response = await fetch(STATE_URL, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(state),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const saved = await response.json();
          statusText.textContent = "База приняла";
          lastAction.textContent = `Отправлено: ${saved.type}${saved.color ? " / " + saved.color : ""}`;
        } catch (error) {
          statusText.textContent = "Ошибка отправки";
          lastAction.textContent = error.message || "Не удалось записать в Firebase";
        }
      }

      function sendFile(file, type) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          sendState({
            type,
            media: {
              name: file.name,
              mime: file.type,
              dataUrl: reader.result,
            },
          });
        };
        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
