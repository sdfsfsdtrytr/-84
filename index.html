<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пульт экрана</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .mini-status {
        margin: 10px 0 0;
        color: #626a76;
        font-size: 16px;
        min-height: 24px;
      }

      .offline-status {
        color: #ef3939;
        font-weight: 900;
      }

      .online-banner {
        display: grid;
        place-items: center;
        min-height: 46px;
        margin: 0 0 12px;
        border: 1px solid #d9dde5;
        border-radius: 8px;
        background: #ffffff;
        color: #19c15f;
        font-weight: 900;
      }

      .online-banner.offline {
        border-color: #ef3939;
        background: #fff4f4;
        color: #ef3939;
      }

      .color-pick-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .color-pick-row input {
        width: 56px;
        height: 44px;
        padding: 0;
        border: 1px solid #d9dde5;
        border-radius: 8px;
        background: #ffffff;
      }

      .text-options {
        display: grid;
        gap: 10px;
      }

      .system-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .system-grid button {
        min-height: 48px;
        border: 1px solid #d9dde5;
        border-radius: 8px;
        padding: 12px;
        background: #111318;
        color: #ffffff;
        font-weight: 800;
      }

      .admin-request {
        display: grid;
        gap: 10px;
        border: 1px solid #d9dde5;
        border-radius: 8px;
        padding: 12px;
        background: #ffffff;
      }

      .admin-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .admin-actions button {
        min-height: 44px;
        border: 1px solid #d9dde5;
        border-radius: 8px;
        padding: 10px;
        font-weight: 800;
      }

      #approveAdminButton {
        background: #19c15f;
        border-color: #19c15f;
        color: #ffffff;
      }

      @media (max-width: 620px) {
        .system-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="control-page">
    <main id="loginScreen" class="gate">
      <div class="gate-card">
        <h1>Управление</h1>
        <input id="passwordInput" type="password" inputmode="numeric" placeholder="Пароль" aria-label="Пароль">
        <button id="loginButton" type="button">Войти</button>
        <p id="loginError" class="error" hidden>Неверный пароль</p>
      </div>
    </main>

    <main id="panel" class="panel" hidden>
      <header class="panel-header">
        <div>
          <h1>Пульт экрана</h1>
          <p id="status">Готово</p>
        </div>
        <button id="blankButton" class="ghost-button" type="button">Очистить</button>
      </header>

      <div id="onlineBanner" class="online-banner offline">Экран не в сети</div>

      <section class="section">
        <h2>Цвет</h2>
        <div class="color-grid">
          <button class="color-button green" data-color="green" type="button">Зелёный</button>
          <button class="color-button yellow" data-color="yellow" type="button">Жёлтый</button>
          <button class="color-button red" data-color="red" type="button">Красный</button>
        </div>
        <label class="switch-row">
          <input id="wordsToggle" type="checkbox">
          <span>Показывать слова</span>
        </label>
        <label class="color-pick-row">
          <input id="screenColor" type="color" value="#19c15f">
          <span>Любой цвет экрана</span>
        </label>
        <button id="sendScreenColor" type="button">Поставить выбранный цвет</button>
        <p id="lastAction" class="mini-status"></p>
      </section>

      <section class="section">
        <h2>Положение телефона</h2>
        <div class="segmented" role="group" aria-label="Положение телефона">
          <button data-orientation="landscape" type="button" class="active">Горизонтально</button>
          <button data-orientation="portrait" type="button">Вертикально</button>
          <button data-orientation="upside" type="button">Вверх ногами</button>
        </div>
      </section>

      <section class="section">
        <h2>Текст</h2>
        <textarea id="message" rows="4" placeholder="Напиши текст для экрана"></textarea>
        <div class="text-options">
          <label class="color-pick-row">
            <input id="textColor" type="color" value="#111111">
            <span>Цвет текста</span>
          </label>
          <label class="switch-row">
            <input id="textBackgroundEnabled" type="checkbox">
            <span>Фон для текста</span>
          </label>
          <label class="color-pick-row">
            <input id="textBackgroundColor" type="color" value="#ffffff">
            <span>Цвет фона текста</span>
          </label>
        </div>
        <button id="sendText" type="button">Готово</button>
      </section>

      <section class="section">
        <h2>Фото и видео</h2>
        <div class="upload-row">
          <label class="file-button">
            Фото
            <input id="imageInput" type="file" accept="image/*">
          </label>
          <label class="file-button">
            Видео
            <input id="videoInput" type="file" accept="video/*">
          </label>
        </div>
        <p class="hint">Лучше брать короткие видео до 20 МБ.</p>
      </section>

      <section class="section">
        <h2>Система</h2>
        <div class="system-grid">
          <button id="powerOffButton" type="button">Выключить экран</button>
          <button id="powerOnButton" type="button">Включить экран</button>
          <button id="restartButton" type="button">Перезагрузить экран</button>
          <button id="maintenanceButton" type="button">Технические работы</button>
          <button id="unavailableButton" type="button">Временно не работает</button>
          <button id="adminButton" type="button">Попасть в админку</button>
          <button id="updateButton" type="button">Обновить</button>
          <button id="exitAdminButton" type="button" hidden>Выйти из админ-панели</button>
        </div>
        <div id="adminRequestBox" class="admin-request" hidden>
          <strong>Вы хотите подтвердить вход в админ-панель?</strong>
          <div class="admin-actions">
            <button id="approveAdminButton" type="button">Подтвердить</button>
            <button id="declineAdminButton" type="button">Отклонить</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const PASSWORD = "230493";
      const STATE_URL = "https://hhh3-635eb-default-rtdb.europe-west1.firebasedatabase.app/statusScreen/current.json";

      const loginScreen = document.querySelector("#loginScreen");
      const panel = document.querySelector("#panel");
      const passwordInput = document.querySelector("#passwordInput");
      const loginButton = document.querySelector("#loginButton");
      const loginError = document.querySelector("#loginError");
      const statusText = document.querySelector("#status");
      const onlineBanner = document.querySelector("#onlineBanner");
      const lastAction = document.querySelector("#lastAction");
      const wordsToggle = document.querySelector("#wordsToggle");
      const screenColor = document.querySelector("#screenColor");
      const message = document.querySelector("#message");
      const textColor = document.querySelector("#textColor");
      const textBackgroundEnabled = document.querySelector("#textBackgroundEnabled");
      const textBackgroundColor = document.querySelector("#textBackgroundColor");
      const orientationButtons = document.querySelectorAll("[data-orientation]");
      const maintenanceButton = document.querySelector("#maintenanceButton");
      const unavailableButton = document.querySelector("#unavailableButton");
      const adminButton = document.querySelector("#adminButton");
      const updateButton = document.querySelector("#updateButton");
      const exitAdminButton = document.querySelector("#exitAdminButton");
      const adminRequestBox = document.querySelector("#adminRequestBox");
      const approveAdminButton = document.querySelector("#approveAdminButton");
      const declineAdminButton = document.querySelector("#declineAdminButton");

      let state = {
        type: "blank",
        color: null,
        showWords: false,
        customText: "",
        media: null,
        orientation: "landscape",
        textColor: "#111111",
        textBackgroundEnabled: false,
        textBackgroundColor: "#ffffff",
        customColor: null,
        systemMode: null,
        savedState: null,
        sequenceStartedAt: null,
        adminRequestStatus: null,
        updatedAt: Date.now(),
      };

      loginButton.addEventListener("click", unlock);
      passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") unlock();
      });

      function unlock() {
        const typed = passwordInput.value.replace(/\D/g, "");
        if (typed !== PASSWORD) {
          loginError.hidden = false;
          return;
        }
        loginError.hidden = true;
        loginScreen.style.display = "none";
        panel.hidden = false;
        panel.style.display = "block";
        statusText.textContent = "Пульт открыт";
        loadState(true);
        window.setInterval(() => loadState(false), 1200);
        window.setInterval(updateOnlineStatus, 1000);
      }

      document.querySelectorAll("[data-color]").forEach((button) => {
        button.addEventListener("click", () => {
          sendState({
            type: "color",
            color: button.dataset.color,
            customColor: null,
            showWords: wordsToggle.checked,
            media: null,
          });
        });
      });

      document.querySelector("#sendScreenColor").addEventListener("click", () => {
        sendState({
          type: "color",
          color: "custom",
          customColor: screenColor.value,
          showWords: false,
          media: null,
        });
      });

      wordsToggle.addEventListener("change", () => {
        sendState({ showWords: wordsToggle.checked });
      });

      orientationButtons.forEach((button) => {
        button.addEventListener("click", () => {
          orientationButtons.forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          sendState({ orientation: button.dataset.orientation });
        });
      });

      document.querySelector("#sendText").addEventListener("click", () => {
        sendState({
          type: "text",
          customText: message.value,
          textColor: textColor.value,
          textBackgroundEnabled: textBackgroundEnabled.checked,
          textBackgroundColor: textBackgroundColor.value,
          media: null,
        });
      });

      document.querySelector("#blankButton").addEventListener("click", () => {
        sendState({
          type: "blank",
          blankColor: "#000000",
          color: null,
          customText: "",
          media: null,
        });
      });

      document.querySelector("#powerOffButton").addEventListener("click", () => {
        const savedState = getRestorableState();
        sendSystemState({
          ...savedState,
          systemMode: "off",
          savedState,
          sequenceStartedAt: Date.now(),
        });
      });

      document.querySelector("#powerOnButton").addEventListener("click", () => {
        const savedState = state.savedState || getRestorableState();
        sendSystemState({
          ...savedState,
          systemMode: "startup",
          savedState,
          sequenceStartedAt: Date.now(),
        });
        restoreAfter(savedState, 11200);
      });

      document.querySelector("#restartButton").addEventListener("click", () => {
        const savedState = state.savedState || getRestorableState();
        sendSystemState({
          ...savedState,
          systemMode: "restart",
          savedState,
          sequenceStartedAt: Date.now(),
        });
        restoreAfter(savedState, 17200);
      });

      maintenanceButton.addEventListener("click", () => {
        if (state.systemMode === "maintenance") {
          const savedState = state.savedState || getRestorableState();
          sendSystemState({ ...savedState, systemMode: null, savedState: null, sequenceStartedAt: null });
          return;
        }
        const savedState = getRestorableState();
        sendSystemState({
          ...savedState,
          systemMode: "maintenance",
          savedState,
          sequenceStartedAt: Date.now(),
        });
      });

      unavailableButton.addEventListener("click", () => {
        if (state.systemMode === "unavailable") {
          const savedState = state.savedState || getRestorableState();
          sendSystemState({ ...savedState, systemMode: null, savedState: null, sequenceStartedAt: null });
          return;
        }
        const savedState = getRestorableState();
        sendSystemState({
          ...savedState,
          systemMode: "unavailable",
          savedState,
          sequenceStartedAt: Date.now(),
        });
      });

      adminButton.addEventListener("click", () => {
        const savedState = getRestorableState();
        sendSystemState({
          ...savedState,
          systemMode: "admin-login",
          savedState,
          adminRequestStatus: "entering",
          sequenceStartedAt: Date.now(),
        });
      });

      approveAdminButton.addEventListener("click", () => {
        const savedState = state.savedState || getRestorableState();
        sendSystemState({
          ...savedState,
          systemMode: "admin-panel",
          savedState,
          adminRequestStatus: "approved",
          sequenceStartedAt: Date.now(),
        });
      });

      declineAdminButton.addEventListener("click", () => {
        const savedState = state.savedState || getRestorableState();
        sendSystemState({
          ...savedState,
          systemMode: "admin-denied",
          savedState,
          adminRequestStatus: "declined",
          sequenceStartedAt: Date.now(),
        });
        restoreAfterExact("admin-denied", savedState, 2200);
      });

      exitAdminButton.addEventListener("click", () => {
        const savedState = state.savedState || getRestorableState();
        sendSystemState({
          ...savedState,
          systemMode: null,
          savedState: null,
          adminRequestStatus: null,
          sequenceStartedAt: null,
        });
      });

      updateButton.addEventListener("click", () => {
        const savedState = getRestorableState();
        sendSystemState({
          ...savedState,
          systemMode: "update",
          savedState,
          sequenceStartedAt: Date.now(),
        });
        restoreAfterExact("update", savedState, 136000);
      });

      document.querySelector("#imageInput").addEventListener("change", (event) => {
        sendFile(event.target.files[0], "image");
      });

      document.querySelector("#videoInput").addEventListener("change", (event) => {
        sendFile(event.target.files[0], "video");
      });

      async function loadState(syncControls) {
        try {
          const response = await fetch(`${STATE_URL}?t=${Date.now()}`, { cache: "no-store" });
          const data = await response.json();
          if (data) state = { ...state, ...data };
          if (syncControls) {
            wordsToggle.checked = Boolean(state.showWords);
            screenColor.value = state.customColor || "#19c15f";
            message.value = state.customText || "";
            textColor.value = state.textColor || "#111111";
            textBackgroundEnabled.checked = Boolean(state.textBackgroundEnabled);
            textBackgroundColor.value = state.textBackgroundColor || "#ffffff";
          }
          updateSystemButtons();
          updateOnlineStatus();
        } catch (error) {
          statusText.textContent = "База не отвечает";
          statusText.classList.add("offline-status");
        }
      }

      async function sendState(patch) {
        if (isSystemLocked()) {
          statusText.textContent = "Сначала отключи системный режим";
          lastAction.textContent = "Обычные команды сейчас не отправляются";
          return;
        }
        state = { ...state, ...patch, updatedAt: Date.now() };
        statusText.textContent = "Отправляю...";
        lastAction.textContent = "";

        try {
          const response = await fetch(STATE_URL, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(state),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const saved = await response.json();
          state = saved;
          updateSystemButtons();
          statusText.textContent = "База приняла";
          lastAction.textContent = `Отправлено: ${saved.type}${saved.color ? " / " + saved.color : ""}`;
        } catch (error) {
          statusText.textContent = "Ошибка отправки";
          lastAction.textContent = error.message || "Не удалось записать в Firebase";
        }
      }

      async function sendSystemState(nextState) {
        state = { ...state, ...nextState, updatedAt: Date.now() };
        statusText.textContent = "Отправляю...";
        lastAction.textContent = "";

        try {
          const response = await fetch(STATE_URL, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(state),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          state = await response.json();
          updateSystemButtons();
          statusText.textContent = "База приняла";
          lastAction.textContent = "Системная команда отправлена";
        } catch (error) {
          statusText.textContent = "Ошибка отправки";
          lastAction.textContent = error.message || "Не удалось записать в Firebase";
        }
      }

      function restoreAfter(savedState, delay) {
        window.setTimeout(() => {
          if (state.systemMode !== "startup" && state.systemMode !== "restart") return;
          sendSystemState({ ...savedState, systemMode: null, savedState: null, sequenceStartedAt: null });
        }, delay);
      }

      function restoreAfterExact(mode, savedState, delay) {
        window.setTimeout(() => {
          if (state.systemMode !== mode) return;
          sendSystemState({
            ...savedState,
            systemMode: null,
            savedState: null,
            adminRequestStatus: null,
            sequenceStartedAt: null,
          });
        }, delay);
      }

      function getRestorableState() {
        const source = state.savedState && isSystemLocked() ? state.savedState : state;
        const {
          systemMode,
          savedState,
          sequenceStartedAt,
          updatedAt,
          ...rest
        } = source;
        return { ...rest };
      }

      function isSystemLocked() {
        return ["off", "startup", "restart", "maintenance", "unavailable", "admin-login", "admin-panel", "admin-denied", "update"].includes(state.systemMode);
      }

      function updateSystemButtons() {
        maintenanceButton.textContent = state.systemMode === "maintenance"
          ? "Отключить техработы"
          : "Технические работы";
        unavailableButton.textContent = state.systemMode === "unavailable"
          ? "Отключить временно не работает"
          : "Временно не работает";
        exitAdminButton.hidden = state.systemMode !== "admin-panel";
        adminButton.hidden = state.systemMode === "admin-panel";
        adminRequestBox.hidden = !(state.systemMode === "admin-login" && state.adminRequestStatus === "pending");
      }

      function updateOnlineStatus() {
        const onlineAt = Number(state.screenOnlineAt || 0);
        const isOnline = onlineAt && Date.now() - onlineAt < 10000;
        statusText.classList.toggle("offline-status", !isOnline);
        statusText.textContent = isOnline ? "Экран в сети" : "Экран не в сети";
        onlineBanner.classList.toggle("offline", !isOnline);
        onlineBanner.textContent = isOnline ? "Экран в сети" : "Экран не в сети";
      }

      function sendFile(file, type) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          sendState({
            type,
            media: {
              name: file.name,
              mime: file.type,
              dataUrl: reader.result,
            },
          });
        };
        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
